:root{

body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:

button,input,select{font:inherit}

input[type=text],select,input[type=number]{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.92);color:var(--text);outline:none;transition:.15s}

.card h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;line-height:1.08;letter-spacing:-.015em;margin:0}

.close{float:right}.cook{font-size:21px}.cook .stepbox{font-family:Georgia,serif;font-size:clamp(29px,4vw,45px);line-height:1.35;background:#fff;border:1px solid var(--line);border-radius:23px;padding:30px;margin:22px 0;box-shadow:var(--shadow2)}
.compact{font-size:16px}.timerbar{display:flex;gap:10px;align-items:center;margin-top:20px}.timerbar input{max-width:100px}
details{background:var(--paper2);border:1px solid #e5ddd1;border-radius:16px;padding:15px;margin-top:20px}summary{cursor:pointer;font-weight:700}
@media(max-width:780px){
 .wrap{padding:17px 18px}.brand{align-items:flex-start;flex-direction:column;gap:9px}.brand .badge{display:none}
 .controls{grid-template-columns:1fr;gap:10px}.grid{grid-template-columns:1fr 1fr;gap:12px}
 .card{min-height:210px;border-radius:21px}.cardvisual{height:75px;padding:12px 14px}.cardvisual .foodicon{width:46px;height:46px;border-radius:15px;font-size:25px}
 .cardcontent{padding:15px}.card h3{font-size:20px}.card small{margin-top:10px}.panel{padding:20px;border-radius:23px}
 .recipebody{grid-template-columns:1fr}.panel h2{font-size:36px}.lead{font-size:16px}.actions button{flex:1 1 auto}

 .grid{grid-template-columns:1fr}.card{min-height:0}.cardvisual{height:72px}.cardcontent{padding:16px 17px}.card h3{font-size:23px}

  ["Salate & Vorspeisen","🥗"],
  ["Vegetarisch & Gemüse","🥬"],
  ["Frühstück & Eiergerichte","🍳"],
  ["Beilagen & Saucen","🥣"],
  ["Kuchen & Torten","🍰"],
  ["Desserts & Süßspeisen","🍮"],
  ["Brot & Gebäck","🥖"],
  ["Getränke & Liköre","🍸"]
];

function findCatCount(label){
  const low=label.toLowerCase();
  return recipes.filter(r=>r.category.toLowerCase()===low || r.category.toLowerCase().includes(low.split(" & ")[0])).length;
}
function renderFeatured(){
  const picks=["R003","R007","R014"];
  const list=picks.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);
  document.querySelector('#featuredGrid').innerHTML=list.map(r=>`
    <article class="featureCard" onclick="openRecipe('${r.id}')">
      <img src="${imgPath(r.id)}" alt="${r.title}">
      <div class="featureCardContent">
        <span class="badge">${r.id}</span>
        <h3>${r.title}</h3>
        <p>${r.category}</p>
      </div>
    </article>`).join('');
}
function renderCategoryTiles(){
  const el=document.querySelector('#categoryTiles');
  el.innerHTML=categoryMeta.map(([name,icon])=>{
    const matching=recipes.filter(r=>r.category===name || r.category.includes(name.split(" & ")[0]));
    const count=matching.length;
    return `<article class="categoryTile" onclick="jumpCategory('${name.replace(/'/g,"\\'")}')">
      <div class="categoryIcon">${icon}</div>
      <div><strong>${name}</strong><small>${count} ${count===1?'Rezept':'Rezepte'}</small></div>
    </article>`;
  }).join('');
}
window.jumpCategory=function(name){
  const sel=document.querySelector('#category');
  const exact=[...sel.options].find(o=>o.value===name);
  if(exact){sel.value=name}
  else{
    const key=name.split(" & ")[0].toLowerCase();
    const opt=[...sel.options].find(o=>o.value.toLowerCase().includes(key));
    sel.value=opt?opt.value:"";
  }
  render();
  document.querySelector('#alle-rezepte').scrollIntoView({behavior:'smooth'});
}

function categories(){
 const cats=[...new Set(recipes.map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'de'));
 category.innerHTML='<option value="">Alle Kategorien</option>'+cats.map(c=>`<option>${c}</option>`).join('');
}
function render(){
 const q=search.value.trim().toLowerCase(), c=category.value, favOnly=$('#favOnly')?.checked;
 const list=recipes.filter(r=>{
   const hay=`${r.id} ${r.title} ${r.category} ${r.description} ${(r.ingredients||[]).join(' ')} ${(r.tags||[]).join(' ')}`.toLowerCase();
   return (!q||hay.includes(q)) && (!c||r.category===c) && (!favOnly||favs.has(r.id));
 });
 count.textContent=`${list.length} von ${recipes.length} Rezepten`;
 grid.innerHTML=list.map(r=>`
 <article class="card" onclick="openRecipe('${r.id}')">
   <div class="cardvisual">
     ${thumbImg(r)}
   </div>
   <div class="cardcontent">
     <h3>${r.title}</h3>
   </div>
 </article>`).join('');
}

function imgPath(id){ return `images/${id}.jpg`; }
function thumbImg(r){
 return `<img class="recipe-thumb" src="${imgPath(r.id)}" alt="${r.title}" loading="lazy"
 onload="this.parentElement.classList.add('hasimg')"
 onerror="this.remove()">`;
}

function iconFor(c){
 if(/kuchen|torte|süß|dessert|germ/i.test(c)) return '🍰';
 if(/pizza|brot|flamm/i.test(c)) return '🍕';
 if(/fisch/i.test(c)) return '🐟';
 if(/grill/i.test(c)) return '🔥';
 if(/getränk/i.test(c)) return '🍸';
 if(/suppe/i.test(c)) return '🥣';
 if(/salat/i.test(c)) return '🥗';
 return '🍽️';
}
window.toggleFav=id=>{favs.has(id)?favs.delete(id):favs.add(id);saveFavs();render();if(current?.id===id)openRecipe(id)}
function sourceText(r){return r.source?`<div class="source">Quelle/Grundlage: ${r.source}</div>`:''}
function ingredientLi(i,idx){return `<li><label><input type="checkbox" class="ingcheck"> <span>${i}</span></label></li>`}
window.openRecipe=function(id){
 speechSynthesis.cancel(); current=recipes.find(r=>r.id===id); if(!current)return;
 const r=current;
 detail.innerHTML=`
 <button class="secondary close" onclick="closeRecipe()">✕ Schließen</button>
 <div class="recipehead"><span class="badge">${r.id}</span><button class="heart big ${favs.has(r.id)?'on':''}" onclick="toggleFav('${r.id}')">${favs.has(r.id)?'♥':'♡'}</button></div>
 <h2>${r.title}</h2><p class="lead">${r.description}</p>
 <div class="heroimage"><img src="${imgPath(r.id)}" alt="${r.title}" onload="this.parentElement.classList.add('show')" onerror="this.parentElement.remove()"></div>
 <div class="meta">${r.servings?`<span>🍽 ${r.servings}</span>`:''}${r.prepTime?`<span>⏱ ${r.prepTime}</span>`:''}${r.cookTime?`<span>🔥 ${r.cookTime}</span>`:''}${r.temperature?`<span>🌡 ${r.temperature}</span>`:''}</div>
 <div class="actions"><button onclick="speakRecipe()">🔊 Vorlesen</button><button onclick="startCook()">👨‍🍳 Kochmodus</button><button class="secondary" onclick="print()">🖨 Drucken</button></div>
 <div class="recipebody">
   <section><h3>Zutaten</h3>${r.ingredientGroups?.length?r.ingredientGroups.map(g=>`<div class="recipe-subgroup"><h4>${g.title}</h4><ul class="ingredients">${g.items.map(ingredientLi).join('')}</ul></div>`).join(''):`<ul class="ingredients">${r.ingredients.map(ingredientLi).join('')}</ul>`}</section>
   <section><h3>Zubereitung</h3>${r.stepGroups?.length?r.stepGroups.map((g,gi)=>`<div class="recipe-subgroup"><h4>${g.title}</h4><ol class="steps">${g.steps.map((st,j)=>{const flat=r.steps.indexOf(st);return `<li><button class="speakmini" onclick="speakStep(${flat})">🔊</button><b>${flat+1}.</b> ${st}</li>`}).join('')}</ol></div>`).join(''):`<ol class="steps">${r.steps.map((st,i)=>`<li><button class="speakmini" onclick="speakStep(${i})">🔊</button><b>${i+1}.</b> ${st}</li>`).join('')}</ol>`}</section>
 </div>
 ${r.tips?.length?`<section class="tip"><h3>Das macht den Unterschied</h3>${r.tips.map(t=>`<p>${t}</p>`).join('')}</section>`:''}
 ${sourceText(r)}
 `;
 overlay.classList.add('open');
}
window.closeRecipe=async()=>{speechSynthesis.cancel();overlay.classList.remove('open');current=null;if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}
function speak(txt){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';u.rate=.95;speechSynthesis.speak(u)}
window.speakStep=i=>current&&speak(current.steps[i]);
window.speakRecipe=()=>current&&speak([current.title,'Zutaten',...current.ingredients,'Zubereitung',...current.steps].join('. '));
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
window.startCook=async function(){
 if(!current)return; await keepAwake(); let idx=0, r=current;
 function paint(){
  detail.innerHTML=`<div class="cook">
   <button class="secondary close" onclick="closeRecipe()">✕ Beenden</button>
   <span class="badge">${r.id} · Schritt ${idx+1}/${r.steps.length}</span>
   <h2>${r.title}</h2>
   <div class="stepbox">${r.steps[idx]}</div>
   <div class="actions">
    <button class="secondary" ${idx===0?'disabled':''} onclick="_prev()">← Zurück</button>
    <button onclick="_speakStep()">🔊 Vorlesen</button>
    <button ${idx===r.steps.length-1?'disabled':''} onclick="_next()">Weiter →</button>
   </div>
   <details><summary>Zutaten einblenden</summary>${r.ingredientGroups?.length?r.ingredientGroups.map(g=>`<h4>${g.title}</h4><ul class="ingredients compact">${g.items.map(ingredientLi).join('')}</ul>`).join(''):`<ul class="ingredients compact">${r.ingredients.map(ingredientLi).join('')}</ul>`}</details>
   <div class="timerbar"><input id="timerMin" type="number" min="1" value="10"><span>Min.</span><button onclick="_timer()">Timer starten</button></div>
  </div>`;
 }
 window._prev=()=>{if(idx>0){idx--;speechSynthesis.cancel();paint()}};
 window._next=()=>{if(idx<r.steps.length-1){idx++;speechSynthesis.cancel();paint()}};
 window._speakStep=()=>speak(r.steps[idx]);
 window._timer=()=>{const m=Number($('#timerMin').value||0);if(m>0){setTimeout(()=>{speak(`Der Timer für ${m} Minuten ist fertig.`);alert(`Timer: ${m} Minuten sind um.`)},m*60000);alert(`Timer für ${m} Minuten gestartet.`)}};
 paint();
}
const heroSearch=document.querySelector('#heroSearch');
heroSearch.addEventListener('input',()=>{search.value=heroSearch.value;render();});
heroSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){document.querySelector('#alle-rezepte').scrollIntoView({behavior:'smooth'});}});

search.addEventListener('input',render);category.addEventListener('change',render);$('#favOnly').addEventListener('change',render);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeRecipe()});
categories();renderFeatured();renderCategoryTiles();render();

</script>
</body></html>
