<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

:root{
  --bg:#f3efe7;--paper:#fffdf9;--paper2:#f8f4ec;--text:#211f1a;--muted:#777066;
  --line:#ddd5c8;--accent:#59634b;--accent-dark:#404938;--warm:#b69065;
  --chip:#ebe4d8;--shadow:0 14px 34px rgba(48,39,29,.08);--shadow2:0 7px 20px rgba(48,39,29,.07)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:
radial-gradient(circle at top right,rgba(182,144,101,.09),transparent 26rem),var(--bg);color:var(--text)}
button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:10;background:rgba(243,239,231,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(221,213,200,.9)}
.wrap{max-width:1220px;margin:auto;padding:20px 24px}
.brand{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}
.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.025em;font-size:clamp(34px,4vw,54px)}
.brand p{margin:5px 0 0;color:var(--muted);font-size:16px}
.brand .badge{margin-bottom:5px}
.controls{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(210px,.75fr) auto;gap:12px;margin-top:20px;align-items:center}
input[type=text],select,input[type=number]{width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.92);color:var(--text);outline:none;transition:.15s}
input[type=text]:focus,select:focus,input[type=number]:focus{border-color:#aaa08f;box-shadow:0 0 0 3px rgba(89,99,75,.09)}
.toggle{display:flex;gap:9px;align-items:center;white-space:nowrap;padding:0 7px;color:#4f4a43}
.toggle input{width:20px;height:20px}
.stats{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:22px 0 18px;color:var(--muted);font-size:15px}
.stats strong{color:var(--text);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;padding-bottom:36px}
.card{position:relative;overflow:hidden;background:var(--paper);border:1px solid rgba(221,213,200,.9);border-radius:24px;box-shadow:var(--shadow2);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cdc3b3}
.cardvisual{height:255px;padding:0;display:block;background:#e9e2d7;border-bottom:1px solid rgba(221,213,200,.72);overflow:hidden}
.cardvisual .recipe-thumb{width:100%;height:100%;object-fit:cover;display:block}
.cardvisual .image-shade,.cardvisual .foodicon,.cardvisual .heart{display:none!important}
.cardcontent{padding:18px 20px 21px;min-height:86px;display:flex;align-items:center}
.cardcontent .badge,.cardcontent p,.cardcontent small{display:none!important}
.card h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;line-height:1.08;letter-spacing:-.015em;margin:0}
.cardtop,.recipehead{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:700;letter-spacing:.04em;color:#777066}
.heart{border:0;background:rgba(255,255,255,.58);color:#726b61;font-size:27px;line-height:1;padding:5px 8px;border-radius:999px}
.heart.on{color:#8a4f49}.heart.big{font-size:34px;background:transparent}

@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{border-radius:19px}
  .cardvisual{height:190px}
  .cardcontent{padding:13px 14px 15px;min-height:70px}
  .card h3{font-size:20px}
}
.overlay{position:fixed;inset:0;background:rgba(33,29,24,.52);display:none;z-index:30;padding:18px;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.panel{margin:auto;max-width:980px;width:100%;max-height:95vh;overflow:auto;background:var(--paper);border:1px solid rgba(255,255,255,.5);border-radius:28px;padding:30px;box-shadow:0 30px 70px rgba(30,25,20,.22)}
.panel h2{max-width:820px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,5vw,58px);line-height:1.02;letter-spacing:-.025em;margin:12px 0}
.lead{max-width:780px;font-size:18px;color:var(--muted);line-height:1.55}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:#5f594f;margin:16px 0 22px}
.meta span{background:var(--paper2);border:1px solid #e8e0d4;padding:8px 11px;border-radius:999px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0 28px}
button{border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:white;font-weight:650;cursor:pointer;transition:.15s}
button:hover{filter:brightness(.97)}button.secondary{background:var(--chip);color:var(--text)}button:disabled{opacity:.35}
.recipebody{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.35fr);gap:28px;align-items:start}
section{margin:26px 0}section h3{font-family:Georgia,"Times New Roman",serif;font-size:27px;margin:0 0 13px}
.ingredients{list-style:none;padding:0;margin:0;background:var(--paper2);border:1px solid #e5ddd1;border-radius:18px;overflow:hidden}
.ingredients li{margin:0;padding:11px 13px;border-bottom:1px solid #e7dfd3;line-height:1.35}.ingredients li:last-child{border-bottom:0}
.ingredients label{display:flex;align-items:flex-start;gap:8px}.ingredients input{width:20px;height:20px;flex:0 0 auto;margin:0;margin-top:1px}
.ingredients input:checked+span{text-decoration:line-through;opacity:.48}
.steps{padding:0;list-style:none;margin:0}.steps li{position:relative;margin:0 0 11px;line-height:1.5;padding:16px 50px 16px 17px;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 13px rgba(50,40,30,.03)}
.steps b{font-family:Georgia,serif;font-size:18px;color:var(--accent-dark);margin-right:5px}
.speakmini{position:absolute;right:10px;top:10px;padding:7px 9px;background:var(--chip);color:var(--text);font-size:14px}
.tip{background:linear-gradient(135deg,#f0e8dc,#f6f1e9);border:1px solid #e2d7c8;border-radius:19px;padding:19px}
.tip h3{font-size:23px}.source{margin-top:28px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.close{float:right}.cook{font-size:21px}.cook .stepbox{font-family:Georgia,serif;font-size:clamp(29px,4vw,45px);line-height:1.35;background:#fff;border:1px solid var(--line);border-radius:23px;padding:30px;margin:22px 0;box-shadow:var(--shadow2)}
.compact{font-size:16px}.timerbar{display:flex;gap:10px;align-items:center;margin-top:20px}.timerbar input{max-width:100px}
details{background:var(--paper2);border:1px solid #e5ddd1;border-radius:16px;padding:15px;margin-top:20px}summary{cursor:pointer;font-weight:700}
@media(max-width:780px){
 .wrap{padding:17px 18px}.brand{align-items:flex-start;flex-direction:column;gap:9px}.brand .badge{display:none}
 .controls{grid-template-columns:1fr;gap:10px}.grid{grid-template-columns:1fr 1fr;gap:12px}
 .card{min-height:210px;border-radius:21px}.cardvisual{height:75px;padding:12px 14px}.cardvisual .foodicon{width:46px;height:46px;border-radius:15px;font-size:25px}
 .cardcontent{padding:15px}.card h3{font-size:20px}.card small{margin-top:10px}.panel{padding:20px;border-radius:23px}
 .recipebody{grid-template-columns:1fr}.panel h2{font-size:36px}.lead{font-size:16px}.actions button{flex:1 1 auto}
}
@media(max-width:470px){
 .grid{grid-template-columns:1fr}.card{min-height:0}.cardvisual{height:72px}.cardcontent{padding:16px 17px}.card h3{font-size:23px}
}
@media print{.topbar,.actions,.close,.heart,.speakmini{display:none!important}.overlay{position:static;display:block!important;background:white;padding:0}.panel{max-height:none;box-shadow:none;max-width:none}.wrap{display:none}.recipebody{display:block}}


.cardvisual{position:relative;overflow:hidden}
.cardvisual.hasimg{background:#e9e2d7}
.cardvisual img.recipe-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cardvisual .image-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.04),rgba(0,0,0,.18));display:none}
.cardvisual.hasimg .image-shade{display:block}
.cardvisual .foodicon,.cardvisual .heart{position:relative;z-index:2}
.cardvisual.hasimg .foodicon{background:rgba(255,255,255,.84);backdrop-filter:blur(4px)}
.cardvisual.hasimg .heart{background:rgba(255,255,255,.84);backdrop-filter:blur(4px)}
.heroimage{width:100%;height:min(42vh,420px);border-radius:22px;overflow:hidden;background:linear-gradient(135deg,rgba(89,99,75,.11),rgba(182,144,101,.11));margin:18px 0 20px;display:none}
.heroimage.show{display:block}
.heroimage img{width:100%;height:100%;object-fit:cover;display:block}


.topbar{position:relative;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:14px;padding-bottom:14px}
.topbar .brand h1{font-size:28px}
.topbar .brand p{font-size:13px}

.hero{position:relative;min-height:520px;display:flex;align-items:center;overflow:hidden;background:#2b2a26}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.78)}
.heroShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,20,17,.72),rgba(22,20,17,.22) 58%,rgba(22,20,17,.12))}
.heroInner{position:relative;z-index:2;width:min(1120px,calc(100% - 40px));margin:auto;color:#fff}
.heroKicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:14px}
.hero h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,72px);line-height:.98;max-width:720px;margin:0 0 16px;letter-spacing:-.035em}
.hero p{font-size:19px;max-width:620px;margin:0 0 28px;color:rgba(255,255,255,.9)}
.heroSearch{display:flex;align-items:center;gap:12px;max-width:650px;padding:0 16px;background:#fff;border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.2)}
.heroSearch span{color:#766f64;font-size:24px}
.heroSearch input{border:0!important;box-shadow:none!important;background:transparent!important;padding:18px 0;font-size:18px}

.homewrap{padding-top:34px}
.featureSection,.categorySection,.allRecipesSection{margin-bottom:46px}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.sectionHead h2{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:-.02em;margin:2px 0 0}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warm)}
.miniCount{color:var(--muted);font-size:14px;font-weight:700}

.featuredGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.featureCard{position:relative;min-height:330px;border-radius:26px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);background:#ddd}
.featureCard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.featureCard:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,15,.72),rgba(20,18,15,.04) 60%)}
.featureCardContent{position:absolute;z-index:2;left:22px;right:22px;bottom:20px;color:#fff}
.featureCardContent .badge{background:rgba(255,255,255,.88);color:#534d45}
.featureCardContent h3{font-family:Georgia,serif;font-size:28px;line-height:1.05;margin:10px 0 6px}
.featureCardContent p{margin:0;color:rgba(255,255,255,.86);font-size:14px}

.categoryTiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.categoryTile{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:18px 14px;min-height:120px;cursor:pointer;box-shadow:0 5px 15px rgba(50,40,30,.04);display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.categoryTile:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.categoryIcon{font-size:31px}
.categoryTile strong{font-family:Georgia,serif;font-size:17px;line-height:1.12}
.categoryTile small{color:var(--muted);margin-top:5px}

.allRecipesSection{padding-top:8px}
.sectionHeadRecipes{margin-bottom:14px}
.allRecipesSection .controls{margin-top:0}
.allRecipesSection .stats{margin-top:12px;margin-bottom:16px}

@media(max-width:900px){
  .featuredGrid{grid-template-columns:1fr 1fr}
  .featuredGrid .featureCard:last-child{grid-column:1/-1;min-height:280px}
  .categoryTiles{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:640px){
  .hero{min-height:470px}
  .heroInner{width:calc(100% - 30px)}
  .hero h2{font-size:44px}
  .hero p{font-size:16px}
  .heroSearch input{font-size:16px}
  .featuredGrid{grid-template-columns:1fr}
  .featuredGrid .featureCard:last-child{grid-column:auto}
  .featureCard{min-height:300px}
  .categoryTiles{grid-template-columns:repeat(2,1fr)}
  .sectionHead h2{font-size:30px}
}

const categoryMeta = [
  ["Fleisch & Geflügel","🍖"],

  ["Beilagen & Saucen","🥣"],
  ["Kuchen & Torten","🍰"],
  ["Desserts & Süßspeisen","🍮"],
  ["Brot & Gebäck","🥖"],
  ["Getränke & Liköre","🍸"]
];

function findCatCount(label){
  const low=label.toLowerCase();
  return recipes.filter(r=>r.category.toLowerCase()===low || r.category.toLowerCase().includes(low.split(" & ")[0])).length;
}
function renderFeatured(){
  const picks=["R003","R007","R014"];
  const list=picks.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);
  document.querySelector('#featuredGrid').innerHTML=list.map(r=>`
    <article class="featureCard" onclick="openRecipe('${r.id}')">
      <img src="${imgPath(r.id)}" alt="${r.title}">
      <div class="featureCardContent">
        <span class="badge">${r.id}</span>
        <h3>${r.title}</h3>
        <p>${r.category}</p>
      </div>
    </article>`).join('');
}
function renderCategoryTiles(){
  const el=document.querySelector('#categoryTiles');
  el.innerHTML=categoryMeta.map(([name,icon])=>{
    const matching=recipes.filter(r=>r.category===name || r.category.includes(name.split(" & ")[0]));
    const count=matching.length;
    return `<article class="categoryTile" onclick="jumpCategory('${name.replace(/'/g,"\\'")}')">
      <div class="categoryIcon">${icon}</div>
      <div><strong>${name}</strong><small>${count} ${count===1?'Rezept':'Rezepte'}</small></div>
    </article>`;
  }).join('');
}
window.jumpCategory=function(name){
  const sel=document.querySelector('#category');
  const exact=[...sel.options].find(o=>o.value===name);
  if(exact){sel.value=name}
  else{
    const key=name.split(" & ")[0].toLowerCase();
    const opt=[...sel.options].find(o=>o.value.toLowerCase().includes(key));
    sel.value=opt?opt.value:"";
  }
  render();
  document.querySelector('#alle-rezepte').scrollIntoView({behavior:'smooth'});
}

function categories(){
 const cats=[...new Set(recipes.map(r=>r.category))].sort((a,b)=>a.localeCompare(b,'de'));
 category.innerHTML='<option value="">Alle Kategorien</option>'+cats.map(c=>`<option>${c}</option>`).join('');
}
function render(){
 const q=search.value.trim().toLowerCase(), c=category.value, favOnly=$('#favOnly')?.checked;
 const list=recipes.filter(r=>{
   const hay=`${r.id} ${r.title} ${r.category} ${r.description} ${(r.ingredients||[]).join(' ')} ${(r.tags||[]).join(' ')}`.toLowerCase();
   return (!q||hay.includes(q)) && (!c||r.category===c) && (!favOnly||favs.has(r.id));
 });
 count.textContent=`${list.length} von ${recipes.length} Rezepten`;
 grid.innerHTML=list.map(r=>`
 <article class="card" onclick="openRecipe('${r.id}')">
   <div class="cardvisual">
     ${thumbImg(r)}
   </div>
   <div class="cardcontent">
     <h3>${r.title}</h3>
   </div>
 </article>`).join('');
}

function imgPath(id){ return `images/${id}.jpg`; }
function thumbImg(r){
 return `<img class="recipe-thumb" src="${imgPath(r.id)}" alt="${r.title}" loading="lazy"
 onload="this.parentElement.classList.add('hasimg')"
 onerror="this.remove()">`;
}

function iconFor(c){
 if(/kuchen|torte|süß|dessert|germ/i.test(c)) return '🍰';
 if(/pizza|brot|flamm/i.test(c)) return '🍕';
 if(/fisch/i.test(c)) return '🐟';
 if(/grill/i.test(c)) return '🔥';
 if(/getränk/i.test(c)) return '🍸';
 if(/suppe/i.test(c)) return '🥣';
 if(/salat/i.test(c)) return '🥗';
 return '🍽️';
}

function sourceText(r){return r.source?`<div class="source">Quelle/Grundlage: ${r.source}</div>`:''}
function ingredientLi(i,idx){return `<li><label><input type="checkbox" class="ingcheck"> <span>${i}</span></label></li>`}

 speechSynthesis.cancel(); current=recipes.find(r=>r.id===id); if(!current)return;
 const r=current;
 detail.innerHTML=`

 <div class="recipehead"><span class="badge">${r.id}</span><button class="heart big ${favs.has(r.id)?'on':''}" onclick="toggleFav('${r.id}')">${favs.has(r.id)?'♥':'♡'}</button></div>
 <h2>${r.title}</h2><p class="lead">${r.description}</p>
 <div class="heroimage"><img src="${imgPath(r.id)}" alt="${r.title}" onload="this.parentElement.classList.add('show')" onerror="this.parentElement.remove()"></div>
 <div class="meta">${r.servings?`<span>🍽 ${r.servings}</span>`:''}${r.prepTime?`<span>⏱ ${r.prepTime}</span>`:''}${r.cookTime?`<span>🔥 ${r.cookTime}</span>`:''}${r.temperature?`<span>🌡 ${r.temperature}</span>`:''}</div>
 <div class="actions"><button onclick="speakRecipe()">🔊 Vorlesen</button><button onclick="startCook()">👨‍🍳 Kochmodus</button><button class="secondary" onclick="print()">🖨 Drucken</button></div>
 <div class="recipebody">
   <section><h3>Zutaten</h3><ul class="ingredients">${r.ingredients.map(ingredientLi).join('')}</ul></section>
   <section><h3>Zubereitung</h3><ol class="steps">${r.steps.map((s,i)=>`<li><button class="speakmini" onclick="speakStep(${i})">🔊</button><b>${i+1}.</b> ${s}</li>`).join('')}</ol></section>
 </div>
 ${r.tips?.length?`<section class="tip"><h3>Das macht den Unterschied</h3>${r.tips.map(t=>`<p>${t}</p>`).join('')}</section>`:''}
 ${sourceText(r)}
 `;
 overlay.classList.add('open');
}
window.closeRecipe=async()=>{speechSynthesis.cancel();overlay.classList.remove('open');current=null;if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}
function speak(txt){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';u.rate=.95;speechSynthesis.speak(u)}
window.speakStep=i=>current&&speak(current.steps[i]);
window.speakRecipe=()=>current&&speak([current.title,'Zutaten',...current.ingredients,'Zubereitung',...current.steps].join('. '));

window.startCook=async function(){

 function paint(){
  detail.innerHTML=`<div class="cook">
   <button class="secondary close" onclick="closeRecipe()">✕ Beenden</button>
   <span class="badge">${r.id} · Schritt ${idx+1}/${r.steps.length}</span>
   <h2>${r.title}</h2>
   <div class="stepbox">${r.steps[idx]}</div>
   <div class="actions">
    <button class="secondary" ${idx===0?'disabled':''} onclick="_prev()">← Zurück</button>
    <button onclick="_speakStep()">🔊 Vorlesen</button>
    <button ${idx===r.steps.length-1?'disabled':''} onclick="_next()">Weiter →</button>
   </div>
   <details><summary>Zutaten einblenden</summary><ul class="ingredients compact">${r.ingredients.map(ingredientLi).join('')}</ul></details>
   <div class="timerbar"><input id="timerMin" type="number" min="1" value="10"><span>Min.</span><button onclick="_timer()">Timer starten</button></div>
  </div>`;
 }
 window._prev=()=>{if(idx>0){idx--;speechSynthesis.cancel();paint()}};
 window._next=()=>{if(idx<r.steps.length-1){idx++;speechSynthesis.cancel();paint()}};
 window._speakStep=()=>speak(r.steps[idx]);
 window._timer=()=>{const m=Number($('#timerMin').value||0);if(m>0){setTimeout(()=>{speak(`Der Timer für ${m} Minuten ist fertig.`);alert(`Timer: ${m} Minuten sind um.`)},m*60000);alert(`Timer für ${m} Minuten gestartet.`)}};
 paint();
}
const heroSearch=document.querySelector('#heroSearch');
heroSearch.addEventListener('input',()=>{search.value=heroSearch.value;render();});
heroSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){document.querySelector('#alle-rezepte').scrollIntoView({behavior:'smooth'});}});

search.addEventListener('input',render);category.addEventListener('change',render);$('#favOnly').addEventListener('change',render);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeRecipe()});
categories();renderFeatured();renderCategoryTiles();render();

</script>
</body></html>
